<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Ho Nguyen Thien Vu — AI Engineer and AI Transformation Specialist</title>
  <desc id="desc">A dark premium profile banner with an abstract neural network motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#0b1830"/>
      <stop offset="1" stop-color="#11152f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.52" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glowBlue">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.055"/>
    </pattern>
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)"/>
  <ellipse cx="180" cy="60" rx="360" ry="250" fill="url(#glowBlue)"/>
  <ellipse cx="1080" cy="300" rx="350" ry="240" fill="url(#glowPurple)"/>

  <g transform="translate(74 73)">
    <rect width="258" height="34" rx="17" fill="#17233a" stroke="#38bdf8" stroke-opacity="0.42"/>
    <circle cx="19" cy="17" r="5" fill="#34d399" filter="url(#nodeGlow)"/>
    <text x="36" y="22" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1.05">AI SYSTEMS • AUTOMATION</text>

    <text y="104" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="48" font-weight="750" letter-spacing="-1.4">Ho Nguyen Thien Vu</text>
    <rect y="126" width="498" height="4" rx="2" fill="url(#accent)"/>
    <text y="168" fill="#c4b5fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="650">AI Engineer</text>
    <circle cx="143" cy="160" r="3" fill="#64748b"/>
    <text x="159" y="168" fill="#7dd3fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="650">AI Transformation Specialist</text>
    <text y="211" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">From operational challenges to reliable AI systems.</text>
  </g>

  <g transform="translate(822 49)" fill="none" stroke-linecap="round">
    <path d="M46 93L144 46L240 104L151 169L60 225L245 250M144 46L151 169M46 93L151 169M240 104L245 250M60 225L151 169L245 250" stroke="#64748b" stroke-opacity="0.34" stroke-width="1.5"/>
    <path d="M46 93L144 46L240 104" stroke="url(#accent)" stroke-opacity="0.8" stroke-width="2"/>
    <path d="M60 225L151 169L245 250" stroke="url(#accent)" stroke-opacity="0.55" stroke-width="2"/>

    <g filter="url(#nodeGlow)">
      <circle cx="46" cy="93" r="8" fill="#07111f" stroke="#38bdf8" stroke-width="3"/>
      <circle cx="144" cy="46" r="10" fill="#07111f" stroke="#60a5fa" stroke-width="3"/>
      <circle cx="240" cy="104" r="8" fill="#07111f" stroke="#818cf8" stroke-width="3"/>
      <circle cx="151" cy="169" r="17" fill="#11152f" stroke="#a78bfa" stroke-width="4"/>
      <circle cx="60" cy="225" r="9" fill="#07111f" stroke="#22d3ee" stroke-width="3"/>
      <circle cx="245" cy="250" r="10" fill="#07111f" stroke="#c084fc" stroke-width="3"/>
    </g>
    <circle cx="151" cy="169" r="5" fill="#e9d5ff"/>

    <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#94a3b8" stroke="none">
      <text x="15" y="73">DATA</text>
      <text x="120" y="22">MODELS</text>
      <text x="246" y="91">APIs</text>
      <text x="116" y="205" fill="#c4b5fd">INTELLIGENCE</text>
      <text x="20" y="260">RAG</text>
      <text x="254" y="278">AUTOMATION</text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="358" rx="25" fill="none" stroke="#c4b5fd" stroke-opacity="0.14" stroke-width="2"/>
</svg>
